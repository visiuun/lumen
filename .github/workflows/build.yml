name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            asset: lumen-x64.exe
          - target: aarch64-pc-windows-msvc
            asset: lumen-arm64.exe
          - target: i686-pc-windows-msvc
            asset: lumen-x86.exe
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/lumen.exe" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset }}" --clobber
