[package]
name = "lumen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Monitor calibration for Windows that changes real hardware settings and keeps them applied"
license = "CC-BY-NC-4.0"
repository = "https://github.com/visiuun/lumen"
readme = "README.md"
keywords = ["monitor", "calibration", "ddc-ci", "gamma", "windows"]
categories = ["command-line-utilities", "hardware-support"]
publish = false

[build-dependencies]
embed-resource = "3"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_UI_ColorSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
